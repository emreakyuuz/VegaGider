name: Windows EXE Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: EXE derle (PyInstaller)
        run: pyinstaller build_windows.spec --noconfirm

      - name: EXE dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: VegaGiderRaporlama-Windows-EXE
          path: dist/VegaGiderRaporlama.exe
